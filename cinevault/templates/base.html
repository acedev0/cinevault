<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090b0f">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="description" content="Private, zero-original-storage streaming from your Telegram film bot.">
    <meta property="og:title" content="CineVault">
    <meta property="og:description" content="Search Telegram and stream returned files without storing the originals.">
    <meta property="og:image" content="/static/social-preview.webp">
    <meta name="twitter:card" content="summary_large_image">
    <title>{% block title %}CineVault{% endblock %}</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/app.js" defer></script>
    {% block scripts %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
  </body>
</html>
