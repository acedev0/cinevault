<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">CineVault one-line VPS installation</title>
  <desc id="desc">A terminal showing the CineVault curl installer and its interactive setup sequence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b0f"/>
      <stop offset="1" stop-color="#151019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff385f"/>
      <stop offset="1" stop-color="#b277ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000" flood-opacity=".46"/>
    </filter>
  </defs>
  <rect width="1400" height="620" fill="url(#background)" rx="38"/>
  <circle cx="1220" cy="70" r="210" fill="#ff385f" opacity=".055"/>
  <circle cx="125" cy="570" r="260" fill="#43a3ff" opacity=".04"/>
  <g filter="url(#shadow)">
    <rect x="90" y="76" width="1220" height="468" rx="24" fill="#0e1117" stroke="#ffffff" stroke-opacity=".11"/>
    <path d="M90 132h1220" stroke="#ffffff" stroke-opacity=".09"/>
    <circle cx="124" cy="104" r="8" fill="#ff5f57"/>
    <circle cx="152" cy="104" r="8" fill="#febc2e"/>
    <circle cx="180" cy="104" r="8" fill="#28c840"/>
    <text x="700" y="110" text-anchor="middle" fill="#727986" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">root@your-vps — CineVault installer</text>
  </g>
  <text x="132" y="185" fill="#42d39b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">root@vps:~#</text>
  <text x="292" y="185" fill="#f4f5f7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">bash &lt;(curl -Ls https://raw.githubusercontent.com/acedev0/cinevault/main/install.sh)</text>
  <text x="132" y="235" fill="#ff6b86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">CineVault VPS installer</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="132" y="280" fill="#7d8491">01</text><text x="184" y="280" fill="#dfe2e8">Telegram API ID + hash</text>
    <text x="132" y="320" fill="#7d8491">02</text><text x="184" y="320" fill="#dfe2e8">Phone, OTP, and optional 2FA</text>
    <text x="132" y="360" fill="#7d8491">03</text><text x="184" y="360" fill="#dfe2e8">Film bot username</text>
    <text x="132" y="400" fill="#7d8491">04</text><text x="184" y="400" fill="#dfe2e8">Port + website login</text>
    <text x="132" y="462" fill="#42d39b">✓ CineVault is ready</text>
    <text x="132" y="500" fill="#8b92a0">Open:</text><text x="198" y="500" fill="#43a3ff">http://YOUR-SERVER-IP:8765</text>
  </g>
  <rect x="742" y="250" width="500" height="172" rx="18" fill="#151920" stroke="url(#accent)" stroke-opacity=".55"/>
  <text x="780" y="294" fill="#a7adb8" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">ORIGINAL MEDIA</text>
  <text x="780" y="343" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Stays in Telegram.</text>
  <text x="780" y="382" fill="#8e95a2" font-family="Inter, Arial, sans-serif" font-size="18">Only metadata + small previews live on the VPS.</text>
</svg>
