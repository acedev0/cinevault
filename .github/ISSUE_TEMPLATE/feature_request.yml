name: Feature request
description: Suggest an improvement that preserves CineVault's privacy model
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: What should become easier or possible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This proposal does not require storing original Telegram media on the server.
          required: true
